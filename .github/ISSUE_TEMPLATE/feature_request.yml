name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behavior you have in mind, and alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Links, screenshots (without personal data), how the change fits the English and Vietnamese sites.
