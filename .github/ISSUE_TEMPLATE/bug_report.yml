name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste secrets, tokens, passwords, email addresses or the contents of your `.env`. Remove them from logs first.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or the commit, for example 1.0.0-rc.1.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Docker Compose from source (docker compose up -d --build)
        - Published images
        - Development setup (Maven and npm)
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Docker version, browser if the problem is in the UI.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs backend` or `docker compose logs frontend`, without secrets.
      render: text
