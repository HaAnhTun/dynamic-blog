# Test classpath only: integration tests that do not extend AbstractIntegrationTest must not write the first-run setup code
# into the working tree.
app.setup.data-dir=${java.io.tmpdir}/blog-it-setup

# Test configuration is an explicit opt-in to development defaults (ProductionMode): the dev JWT secret, the seeded admin
# password and an empty VIEWS_TOKEN or CLIENT_IP_TOKEN. Production is the default everywhere else.
app.allow-dev-defaults=true
app.security.jwt-secret=dev-only-secret-change-me-this-must-be-at-least-32-bytes-long

# The throw-away MFA key (MfaProperties.DEV_ENCRYPTION_KEY): the secrets of a test database protect nothing.
app.mfa.encryption-key=kKTD05O9CzY77GBpadFxIY3buL3OixPWeQpATErrgxM=

# The per-client-address limits (RateLimiter) are keyed on the socket address in tests, and every request of the shared context comes from the
# same MockMvc address, so the production numbers would make unrelated tests fail. They are lifted here; the tests of the limits themselves
# (ClientAddressLimitsIT, SetupClientRateLimitIT, the unit tests) set the real numbers back with @TestPropertySource.
app.rate-limit.contact-client.per-hour=100000
app.rate-limit.contact-global.per-hour=100000
app.rate-limit.newsletter-signup-client.per-hour=100000
app.rate-limit.newsletter-signup-global.per-hour=100000
app.rate-limit.newsletter-token-client.per-hour=100000
app.rate-limit.newsletter-confirm-global.per-hour=100000
app.rate-limit.login-client.per-ten-minutes=100000
app.rate-limit.mfa-client.per-ten-minutes=100000
app.rate-limit.refresh-client.per-ten-minutes=100000
app.rate-limit.setup-client.per-minute=100000
app.rate-limit.search-client.per-minute=100000

# The limits on an AUTHOR (docs/CONFIGURATION.md, "Author limits") are lifted for the same reason: the shared context keeps every post, tag
# and category that every class created, and one test author writes far more than the real numbers allow. The tests of the limits
# (AuthorQuotaIT) and the unit tests set the real numbers back.
app.rate-limit.post-write.per-ten-minutes=100000
app.rate-limit.taxonomy-create.per-hour=100000
app.rate-limit.media-upload.per-ten-minutes=100000
app.author-quota.max-posts-per-day=100000
app.author-quota.max-tags=100000
app.author-quota.max-categories=100000

# Every cached Spring context of the suite (the shared one, and one for each IT with a property of its own or a database of its own)
# keeps its Hikari pool open until the JVM ends. With the default of ten idle connections per pool, thirty-odd contexts used all 300
# connections of the test PostgreSQL (AbstractIntegrationTest) and the next database creation failed with "too many clients already".
# A pool now keeps one idle connection and gives the others back after ten seconds, which is what a context that nobody is using needs.
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
