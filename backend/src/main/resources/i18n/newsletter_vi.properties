confirmation.subject=Xác nhận đăng ký nhận bài mới
confirmation.body=Chào bạn,\n\
\n\
Địa chỉ này vừa được dùng để đăng ký nhận thư mỗi khi blog có bài mới.\n\
Mở liên kết dưới đây rồi bấm "Xác nhận đăng ký" để bắt đầu nhận thư.\n\
Liên kết dùng được trong 48 giờ.\n\
\n\
{0}\n\
\n\
Nếu không phải bạn đăng ký, cứ bỏ qua thư này: không xác nhận thì\n\
bạn không nhận thêm thư nào.\n\
\n\
Không muốn nhận thư từ địa chỉ này nữa: {1}\n
